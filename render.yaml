# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: edpersonalmeida
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edpersonalmeida-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: edpersonalmeida-db
    plan: free
    databaseName: edpersonalmeida
    user: edpersonalmeida
