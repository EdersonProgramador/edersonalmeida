# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: edpersonalmeida
    runtime: node
    plan: free
    buildCommand: npm ci && RENDER=true npm run build -w @edpersonalmeida/api
    startCommand: npm run db:migrate -w @edpersonalmeida/api && npm run start:render
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_ORIGIN
        value: https://edpersonalmeida.vercel.app
      - key: RENDER
        value: "true"
