# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: edpersonalmeida
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    disk:
      name: edpersonalmeida-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/app.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    startCommand: npm run start:render
